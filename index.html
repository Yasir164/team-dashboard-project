<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Team Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">DashCo</div>
    <h2>Team Dashboard</h2>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <nav>
        <a href="#">Overview</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <main>
      <h1>Dashboard</h1>
      <p>This is the main content area. It doesn't change in this demo.</p>

      <section class="cards">
        <div class="card">
          <h3>128</h3>
          <p>Active Users</p>
        </div>
        <div class="card">
          <h3>42</h3>
          <p>Open Tickets</p>
        </div>
        <div class="card">
          <h3>97%</h3>
          <p>Uptime</p>
        </div>
      </section>

    </main>

  </div>

  <footer>
    <p>&copy; 2026 DashCo. All rights reserved.</p>
  </footer>

</body>
</html>
